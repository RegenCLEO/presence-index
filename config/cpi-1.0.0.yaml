# CLEO Presence Index 1.0.0: weights, curves and thresholds.
# Generated from calculator/reference.py. calculator/tests/test_config.py fails if the two differ.
version: "1.0.0"

signals:
  rec.ai_recommendation:
    layer: recognition
    surface: ai_search
    weight: 24
  rec.organic_search:
    layer: recognition
    surface: search
    weight: 14
  rec.reviews:
    layer: recognition
    surface: reviews
    weight: 12
  rec.ai_citation:
    layer: recognition
    surface: ai_search
    weight: 10
  rec.independent_mentions:
    layer: recognition
    surface: social
    weight: 10
  rdy.crawl_access:
    layer: readiness
    surface: website
    weight: 9
  rdy.site_seo:
    layer: readiness
    surface: website
    weight: 9
  rdy.social:
