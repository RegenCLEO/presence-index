# Log-normal curves: x50 scores 50, x90 scores 90. v1.0 defaults, calibrated at a later release.
curves:
  rec.ai_recommendation: {x50: 0.15, x90: 0.5}
  rec.ai_citation: {x50: 0.05, x90: 0.25}
  rec.organic_search: {x50: 0.05, x90: 0.25}
  rec.independent_mentions: {x50: 10.0, x90: 60.0}
  rec.reviews.volume: {x50: 50.0, x90: 400.0}

engine_weights:
  chatgpt: 0.41
  google_ai: 0.25
  gemini: 0.21
  claude: 0.08
  perplexity: 0.05

answer_agents:
  chatgpt: [OAI-SearchBot, ChatGPT-User]
  google_ai: [Googlebot]
  gemini: [Googlebot]
  claude: [Claude-SearchBot, Claude-User]
  perplexity: [PerplexityBot, Perplexity-User]

