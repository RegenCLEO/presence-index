# Drop 1 of the CLEO Presence Index public scan. Frozen on 21 November 2026.
# Claude (Fable 5.2) drafted the questions and the keyword candidates on 21 November 2026.
# The operator ordered the run the same day. No named person has read the panel line by
# line yet. Write the approver's name and the date here once one has.
#
# Which businesses count, written before the scan ran. A business the answers name counts
# as a Black Friday retailer when a shopper in the United States can buy products from it
# directly, in a store or on its own website. A marketplace
# counts as one business. A store brand or a sub-brand counts under its parent's retail
# name. These do not count: deal, coupon and price comparison sites, news and review
# sites, payment and delivery services, grocery, pharmacy and convenience chains, and
# phone carriers.
# Changed at 12:36 UTC on the scan day, while the answers were being collected and before
# any had been read: a maker whose products other retailers sell does not count, even
# when it runs its own store. The answer reader cannot tell a maker named as a store from
# a maker named for its products, so its rate would be inflated. A chain that sells
# mainly its own label in its own stores counts.
panel_id: black-friday-retailers-us-en-2026-11
protocol: PS-1.0
category: Black Friday retailers
market: {country: US, language: en}

# The scan day is Saturday 21 November 2026. Monday 23 November is the reserve day and
# the second keyword pull, which falls in the next calendar week.
days: ["2026-11-21", "2026-11-23"]
runs_per_day: 2
keyword_pulls: ["2026-11-21", "2026-11-23"]

# No brand list. The scan ranks the 25 businesses the answers name most often.
# A person confirms each one's domain in additions.yaml after the first parse.
selection:
  mode: ai_top
  ai_named_max: 25

# The engines are asked the way CLEO's product asks them, as its code stood on
# 21 November 2026: ChatGPT through a data provider's scraper of chatgpt.com, Claude
# Sonnet 5.5 with the basic web search tool and four searches at most, and Gemini 3.5
# Flash on Vertex AI. Unlike the product, the scan sends no system prompt.
engines:
  chatgpt: {adapter: chatgpt_scraper}
  google_ai: {}
  claude: {model: "claude-sonnet-5-5", max_searches: 4, web_search_tool: web_search_20250305}
  gemini: {model: "gemini-3.5-flash", route: vertex}

# The product has no answer readers, so these three are this scan's own choice.
reader:
  first: {provider: anthropic, model: "claude-haiku-5-5"}
  second: {provider: gemini, model: "gemini-3.5-flash"}
  tiebreak: {provider: anthropic, model: "claude-sonnet-5-5"}

# 60 questions: 12 general and six for each of eight product groups.
# Rule: no retailer name and no product brand name in any question.
# Each product group has the same six kinds of question: best place to buy, best deals,
# best website, lowest price, a service question and a narrower product question.
